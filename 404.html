    <meta name="theme-color" content="#0B1826" />
    <title>Vending Solutions Bahamas | Premium Vending, Fully Managed, No Cost</title>
    <!-- Apply the saved theme before first paint so a light-mode visitor never
         sees a dark flash (and vice versa). Dark is the default. -->
    <script>
      (function () {
        var t = 'dark'
        try {
          t = localStorage.getItem('vsb-theme') || 'dark'
        } catch (e) {}
        if (t !== 'light') t = 'dark'
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m) m.setAttribute('content', t === 'dark' ? '#0B1826' : '#ffffff')
      })()
    </script>
    <style>
      html {
        background: #0b1826;
      }
      html[data-theme='light'] {
        background: #fff;
      }
    </style>
